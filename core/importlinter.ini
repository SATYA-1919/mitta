; Layer dependency contracts — DEC-029.
;
; ARCHITECTURE.md §3 states each layer depends only on the interfaces below it.
; A diagram cannot enforce that; this file can. CI fails the build on violation.
;
; Layers are added to the `layers` contract as each phase lands them. Listing a
; module that does not exist yet is an error, so the contract grows with the
; codebase rather than being written against a hoped-for future.

[importlinter]
root_package = mitta
include_external_packages = True

; --------------------------------------------------------------------------
; The layer ordering. Higher entries may import lower ones; never the reverse.
; Phase 3 lands the infrastructure tiers; the agent pipeline arrives later.
;
; NOTE ON ORDERING. ARCHITECTURE.md §3 numbers the *agent pipeline* layers and
; places the OS Adapter at layer 9, near the bottom of that stack. That
; numbering describes request flow, not module dependency, and the two are not
; the same axis. `config.paths` must ask the platform where the storage root
; lives, so `os_adapter` is a dependency *of* configuration and sits below it
; here. Ordering these by the pipeline numbers produced a contract that failed
; on its first run against correct code.
; --------------------------------------------------------------------------
[importlinter:contract:layers]
name = MITTA architectural layers
type = layers
layers =
    mitta.api
    mitta.runtime
    mitta.tasks
    mitta.agent
    mitta.policy
    mitta.tools
    mitta.personality
    mitta.llm
    mitta.conversations
    mitta.memory
    mitta.projects
    mitta.persistence
    mitta.telemetry
    mitta.config
    mitta.os_adapter
    mitta.errors

; --------------------------------------------------------------------------
; R1's enforcement clause, made checkable: no macOS assumption may appear above
; the OS Adapter boundary. `mac.py` is the ONLY module permitted to touch
; platform APIs, and everything else must go through the adapter protocol.
; --------------------------------------------------------------------------
[importlinter:contract:no-platform-leakage]
name = Platform APIs confined to the OS adapter
type = forbidden
source_modules =
    mitta.api
    mitta.agent
    mitta.tools
    mitta.policy
    mitta.tools
    mitta.personality
    mitta.conversations
    mitta.llm
    mitta.conversations
    mitta.memory
    mitta.projects
    mitta.persistence
    mitta.config
    mitta.telemetry
forbidden_modules =
    subprocess
    plistlib
    ctypes
allow_indirect_imports = True

; --------------------------------------------------------------------------
; The security boundary from ARCHITECTURE.md §3, expressed structurally.
;
; A tool cannot reach the platform directly: the policy engine holds the OS
; Adapter. Bypassing permission therefore means editing the composition root
; AND breaking this contract, rather than calling a different function. A model
; cannot talk its way past a reference that does not exist.
[importlinter:contract:tool-cannot-reach-os]
name = Tool Manager holds no OS Adapter reference
type = forbidden
source_modules =
    mitta.tools
forbidden_modules =
    mitta.os_adapter
