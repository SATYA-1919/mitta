<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data: asset:; style-src 'self' 'unsafe-inline'"
    />
    <title>MITTA — Command Palette</title>
    <style>
      /* The palette window is transparent; the glass panel is the visible
         surface. Set here rather than in a stylesheet so it applies before the
         first stylesheet resolves and the window never flashes opaque. */
      html,
      body {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/palette.tsx"></script>
  </body>
</html>
