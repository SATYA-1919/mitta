<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      No remote origins. The shell loads only what it ships with; a CDN link here
      would be a network dependency on first paint and a hole in the local-first
      claim (R5).

      `ipc:` and `http://ipc.localhost` are how Tauri's IPC reaches Rust. This
      meta tag and the `csp` in tauri.conf.json are BOTH applied, and the
      stricter wins — so omitting them here silently blocked every IPC call
      while the config looked correct. The app reported "Disconnected" with a
      perfectly healthy Rust side behind it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data: asset:; style-src 'self' 'unsafe-inline'"
    />
    <title>MITTA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
